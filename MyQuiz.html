<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 style="text-align: center">My Table</h1>
    <h1 style="text-align: center">^_^</h1>
    <br />
    <!-- ทำโจทย์สร้างตารางแสดงดังรูปที่ส่งให้ในแชท -->
    <table border="1" width="400">
      <tr>
        <td>1</td>
        <td colspan="2" rowspan="2">2</td>
        <td>4</td>
        <td colspan="2">5</td>
        <td rowspan="5">7</td>
      </tr>
      <tr>
        <td>1</td>
        <td>4</td>
        <td>5</td>
        <td rowspan="3">6</td>
      </tr>
      <tr>
        <td rowspan="3">1</td>
        <td>2</td>
        <td colspan="3" rowspan="2">3</td>
      </tr>
      <tr>
        <td>2</td>
      </tr>
      <tr>
        <td colspan="2">2</td>
        <td rowspan="2">3</td>
        <td>4</td>
        <td>5</td>
      </tr>
      <tr>
        <td>1</td>
        <td>2</td>
        <td>3</td>
        <td colspan="2" rowspan="2">5</td>
        <td>7</td>
      </tr>
      <tr>
        <td colspan="3" rowspan="2">1</td>
        <td>4</td>
        <td rowspan="2">7</td>
      </tr>
      <tr>
        <td>4</td>
        <td>5</td>
        <td>6</td>
      </tr>
    </table>
  </body>
</html>
