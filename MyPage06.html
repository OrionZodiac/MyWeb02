<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- html table tag (block) -->
    <!-- แบบที่ทุกแถวมีจำนวนคอลัมน์เท่ากัน -->
    <table border="1" width="400">
      <tr>
        <td>a</td>
        <td>b</td>
        <td>c</td>
      </tr>
      <tr>
        <td>d</td>
        <td>e</td>
        <td>f</td>
      </tr>
      <tr>
        <td>g</td>
        <td>h</td>
        <td>i</td>
      </tr>
    </table>
    <!-- แบบที่ทุกแถวมีจำนวนคอลัมน์เท่ากันบ้างไม่เทากันบ้าง -->
    <table border="1" width="400">
      <tr>
        <td colspan="2">a</td>
        <td>b</td>
        <td>c</td>
      </tr>
      <tr>
        <td rowspan="2">a</td>
        <td>b</td>
        <td colspan="2">c</td>
      </tr>
      <tr>
        <td colspan="2">a</td>
        <td rowspan="2">b</td>
      </tr>
      <tr>
        <td>c</td>
        <td>d</td>
        <td>e</td>
      </tr>
    </table>
    <br /><br /><br /><br />
    <!--  -->
  </body>
</html>
